<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="-apple-system, 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1d1d1f; }
      .node { rx: 12; ry: 12; stroke-width: 1.5; }
      .label { font-size: 13.5px; font-weight: 600; fill: #1d1d1f; text-anchor: middle; }
      .sub { font-size: 11px; fill: #515154; text-anchor: middle; }
      .edge { stroke: #8e8e93; stroke-width: 1.6; fill: none; marker-end: url(#head); }
      .cond { stroke: #d9730d; stroke-width: 1.6; fill: none; marker-end: url(#headOrange); stroke-dasharray: 6 4; }
      .edgeLabel { font-size: 11px; fill: #d9730d; font-weight: 600; }
      .legend { font-size: 12px; fill: #515154; }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e8e93"/></marker>
    <marker id="headOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d9730d"/></marker>
  </defs>
  <rect width="1180" height="520" fill="#fbfbfd"/>
  <text x="40" y="44" class="title">에이전트 상태 그래프 (StateGraph&lt;AgentState&gt;)</text>
  <text x="40" y="70" class="legend">실선: 고정 간선 · 주황 점선: 조건부 간선 · 회색 노드: 빠른 모드에서는 ⏭ 건너뜀</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="110" width="150" height="64" class="node" fill="#e8f0fe" stroke="#a8c3f7"/>
    <text x="115" y="137" class="label">입력 분석</text><text x="115" y="156" class="sub">언어 감지 · 질의 초기화</text>

    <rect x="230" y="110" width="150" height="64" class="node" fill="#f2f2f7" stroke="#c7c7cc"/>
    <text x="305" y="137" class="label">이미지 이해</text><text x="305" y="156" class="sub">Vision 분류 + OCR</text>

    <rect x="420" y="110" width="150" height="64" class="node" fill="#f2f2f7" stroke="#c7c7cc"/>
    <text x="495" y="137" class="label">질의 재작성</text><text x="495" y="156" class="sub">@Generable QueryRewrite</text>

    <rect x="610" y="110" width="150" height="64" class="node" fill="#e8f0fe" stroke="#a8c3f7"/>
    <text x="685" y="137" class="label">하이브리드 검색</text><text x="685" y="156" class="sub">코사인 0.65 + 키워드 0.35</text>

    <rect x="800" y="110" width="150" height="64" class="node" fill="#f2f2f7" stroke="#c7c7cc"/>
    <text x="875" y="137" class="label">관련성 채점</text><text x="875" y="156" class="sub">RelevanceGrade × ≤5</text>

    <rect x="990" y="110" width="150" height="64" class="node" fill="#fff4e0" stroke="#f3c77a"/>
    <text x="1065" y="137" class="label">그래프 확장</text><text x="1065" y="156" class="sub">1홉 사실 + 지식 부족 판정</text>
  </g>
  <path d="M190 142 L230 142" class="edge"/>
  <path d="M380 142 L420 142" class="edge"/>
  <path d="M570 142 L610 142" class="edge"/>
  <path d="M760 142 L800 142" class="edge"/>
  <path d="M950 142 L990 142" class="edge"/>

  <!-- Branch -->
  <path d="M1065 174 L1065 230 L875 230 L875 270" class="cond"/>
  <text x="900" y="222" class="edgeLabel">지식 부족 + 심층 + MCP 도구 있음</text>
  <path d="M1065 174 L1065 330 L760 330" class="cond"/>
  <text x="1075" y="300" class="edgeLabel">충분</text>

  <!-- Row 2 -->
  <g>
    <rect x="800" y="270" width="150" height="64" class="node" fill="#fde8e8" stroke="#f0a3a3"/>
    <text x="875" y="297" class="label">외부 도구 (MCP)</text><text x="875" y="316" class="sub">세션 + 브리지 도구 + 지식 검색</text>

    <rect x="800" y="380" width="150" height="64" class="node" fill="#fde8e8" stroke="#f0a3a3"/>
    <text x="875" y="407" class="label">지식 학습</text><text x="875" y="426" class="sub">도구 결과 → 청크 + 그래프 저장</text>

    <rect x="610" y="298" width="150" height="64" class="node" fill="#eaf7ee" stroke="#9ad3ac"/>
    <text x="685" y="325" class="label">초안 생성</text><text x="685" y="344" class="sub">하네스 프롬프트 · 스트리밍</text>

    <rect x="420" y="298" width="150" height="64" class="node" fill="#eaf7ee" stroke="#9ad3ac"/>
    <text x="495" y="325" class="label">하네스 검증</text><text x="495" y="344" class="sub">규칙 검사 → 수정 · 근거 판정</text>

    <rect x="230" y="298" width="150" height="64" class="node" fill="#eaf7ee" stroke="#9ad3ac"/>
    <text x="305" y="325" class="label">마무리</text><text x="305" y="344" class="sub">인용된 출처만 첨부</text>

    <rect x="60" y="306" width="110" height="48" class="node" fill="#1d1d1f" stroke="#1d1d1f"/>
    <text x="115" y="335" class="label" fill="#ffffff" style="fill:#fff">END</text>
  </g>
  <path d="M875 334 L875 380" class="edge"/>
  <path d="M800 412 L690 412 L690 362" class="edge"/>
  <path d="M610 330 L570 330" class="edge"/>
  <path d="M420 330 L380 330" class="edge"/>
  <path d="M230 330 L170 330" class="edge"/>

  <!-- Notes -->
  <text x="40" y="470" class="legend">상태(AgentState): question · images · mode · history · queries · retrieved · graphFacts · toolResults · knowledgeGap · context · draft · verdict · answer · citations</text>
  <text x="40" y="494" class="legend">모든 노드는 TraceEvent(상태·요약·소요 ms)를 보고하고, UI의 추적 패널과 에이전트 그래프 탭이 이를 그린다. 최대 24스텝으로 무한 루프를 막는다.</text>
</svg>
